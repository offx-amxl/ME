<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Catch the Sunshine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed sky canvas; HUD pinned top, message toast below it, centered cards for start and finale. */
:root {
  --sky-top-sad: #8d95bd;
  --sky-bot-sad: #c9cbe2;
  --sky-top-glad: #ffb48a;
  --sky-bot-glad: #ffe6bf;
  --ground-sad: #8fa3a0;
  --ground-glad: #78c48a;
  --ink: #3a2f4f;
  --paper: #fff8ef;
  --rose: #ef5d7a;
  --sun: #ffc23d;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky-top-sad);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; background: var(--sky-top-sad); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.stat { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); opacity: .75; }
#score { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { flex: 1; min-width: 80px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.45); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--rose); transition: width .4s ease; }
#snd {
  pointer-events: auto; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink);
  background: rgba(255,248,239,.8); border: 0; border-radius: 99px; padding: 8px 14px; cursor: pointer;
}

.toast {
  position: absolute; left: 0; right: 0; top: 64px; margin-inline: auto; width: fit-content; max-width: min(88%, 420px);
  background: var(--paper); color: var(--ink); text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.3; text-wrap: balance;
  padding: 14px 20px; border-radius: 18px; box-shadow: 0 8px 24px rgba(58,47,79,.22);
  opacity: 0; transform: translateY(-8px); transition: opacity .35s ease, transform .35s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(58,47,79,.38);
}
.card {
  width: 100%; max-width: 360px; background: var(--paper); border-radius: 24px; padding: 26px 24px 24px;
  box-shadow: 0 16px 48px rgba(58,47,79,.35); display: flex; flex-direction: column; gap: 14px;
}
.card h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; line-height: 1.5; }
.card .how { font-size: 15px; opacity: .85; }
.card label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.card input {
  font: inherit; font-size: 17px; color: var(--ink); background: #fff; border: 2px solid #e6d9ca;
  border-radius: 12px; padding: 11px 14px; width: 100%; box-sizing: border-box;
}
.card input:focus-visible, button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.go {
  font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; background: var(--rose);
  border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer; box-shadow: 0 5px 0 #c8415c;
}
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #c8415c; }
.go.alt { color: var(--ink); background: #fff; box-shadow: 0 5px 0 #e6d9ca; }
.go.alt:active { box-shadow: 0 2px 0 #e6d9ca; }
.finale-msg { font-size: 18px !important; }
@media (prefers-reduced-motion: reduce) {
  .toast, .bar i { transition: none; }
}
</style>

<div id="app">
  <canvas id="cv" aria-label="Game field: move the teacup to catch falling hearts"></canvas>

  <div class="hud">
    <div class="stat"><span class="lbl">Sunshine</span><b id="score">0</b></div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <button id="snd" type="button">Sound on</button>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <div id="start" class="overlay">
    <div class="card">
      <span class="lbl">Made for Nikhitha</span>
      <h1>Catch the Sunshine</h1>
      <p class="how">Slide your finger to move the teacup. Catch the hearts and stars. Catch a grumpy grey cloud and it turns into sunshine.</p>
      <button id="play" class="go" type="button">Play</button>
    </div>
  </div>

  <div id="finale" class="overlay" hidden>
    <div class="card">
      <h1>The sky is clear</h1>
      <p id="finaleMsg" class="finale-msg"></p>
      <button id="again" class="go" type="button">Play again</button>
      <button id="menu" class="go alt" type="button">Main menu</button>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- Edit these to personalise ----
  var GOAL = 30;          // sunshine needed for the big message
  var MSG_EVERY = 5;      // a sweet note pops up every N sunshine
  var NAME = "Nikhitha";
  var MESSAGES = [
    "Nikhitha, you make ordinary days feel softer.",
    "Whatever today was, you don't have to carry it alone.",
    "Your smile is my favourite thing on this planet.",
    "Bad days end. You, I plan to keep.",
    "You're doing better than you think, Nikhitha.",
    "Rest is allowed. So is a good cry. So is a snack.",
    "I'm proud of you, quietly and loudly.",
    "Sending you the biggest hug that fits in a phone."
  ];
  function finaleText(name) {
    return name + ", I made this because I wish I could fix the sad part. I can't, but I can stay right here with you. I love you.";
  }
  // -----------------------------------

  var $ = function (id) { return document.getElementById(id); };
  var cv = $("cv"), ctx = cv.getContext("2d");
  var css = getComputedStyle(document.documentElement);
  var tok = function (n) { return css.getPropertyValue(n).trim(); };
  var rgb = function (h) { h = h.replace("#", ""); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); };
  var mix = function (a, b, t) { return "rgb(" + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(",") + ")"; };
  var C = {
    topSad: rgb(tok("--sky-top-sad")), botSad: rgb(tok("--sky-bot-sad")),
    topGlad: rgb(tok("--sky-top-glad")), botGlad: rgb(tok("--sky-bot-glad")),
    gSad: rgb(tok("--ground-sad")), gGlad: rgb(tok("--ground-glad")),
    sun: rgb(tok("--sun")), rose: tok("--rose"), ink: tok("--ink"), paper: tok("--paper"), sunHex: tok("--sun")
  };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  var W = 0, H = 0, groundY = 0;
  var cup = { x: 0, tx: 0, y: 0, w: 92 };
  var items = [], parts = [], flowers = [];
  var score = 0, running = false, spawnT = 0, lastLevel = 0, won = false, t = 0, dp = 0, happy = 0;
  var keys = { l: false, r: false };
  var userName = NAME;

  function resize() {
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - 52;
    cup.y = groundY - 14;
    if (!cup.x) { cup.x = W / 2; cup.tx = W / 2; }
    cup.x = clamp(cup.x, cup.w / 2, W - cup.w / 2);
    cup.tx = clamp(cup.tx, cup.w / 2, W - cup.w / 2);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  window.addEventListener("resize", resize);
  resize();

  // ---- sound ----
  var ac = null, soundOn = true;
  function blip(f, len) {
    if (!ac || !soundOn) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (len || 0.25));
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + (len || 0.25) + 0.02);
    } catch (e) {}
  }
  var scale = [523, 587, 659, 784, 880, 1047];
  $("snd").addEventListener("click", function () {
    soundOn = !soundOn; this.textContent = soundOn ? "Sound on" : "Sound off";
  });

  // ---- toast ----
  var toastEl = $("toast"), toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 3400);
  }

  // ---- game logic ----
  function burst(x, y, n, colors) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 170;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0, max: 0.6 + Math.random() * 0.6, r: 2 + Math.random() * 4, c: colors[i % colors.length] });
    }
  }
  var petalColors = [C.rose, "#ff9eb5", "#ffd166", "#c4a8ff", "#ffffff"];
  function addFlower() {
    if (flowers.length > 70) flowers.shift();
    flowers.push({ x: 18 + Math.random() * (W - 36), h: 18 + Math.random() * 28, c: petalColors[Math.floor(Math.random() * petalColors.length)], born: t });
  }
  function spawn() {
    var r = Math.random();
    var type = r < 0.6 ? "heart" : r < 0.84 ? "star" : "cloud";
    items.push({
      type: type, x: 30 + Math.random() * (W - 60), y: -34,
      vy: (85 + Math.random() * 50) * Math.max(0.8, H / 700) * (type === "cloud" ? 0.72 : 1),
      r: type === "cloud" ? 28 : 16, rot: Math.random() * 6, sw: Math.random() * 6
    });
  }
  function setScore(v) {
    score = v;
    $("score").textContent = score;
    $("fill").style.width = Math.min(100, score / GOAL * 100) + "%";
  }
  function caught(it) {
    var gain = it.type === "cloud" ? 3 : 1;
    happy = 0.6;
    if (it.type === "cloud") {
      burst(it.x, it.y, 28, [C.sunHex, "#fff2b0", C.rose]);
      blip(988, 0.35); setTimeout(function () { blip(1319, 0.35); }, 90);
    } else {
      burst(it.x, it.y, 10, it.type === "heart" ? [C.rose, "#ff9eb5"] : [C.sunHex, "#fff2b0"]);
      blip(scale[Math.floor(Math.random() * scale.length)], 0.22);
    }
    for (var i = 0; i < gain; i++) addFlower();
    setScore(score + gain);
    var level = Math.floor(score / MSG_EVERY), shown = false;
    while (lastLevel < level) {
      lastLevel++;
      if (!(score >= GOAL && !won)) { toast(MESSAGES[(lastLevel - 1) % MESSAGES.length]); shown = true; }
    }
    if (score >= GOAL && !won) finish();
    else if (it.type === "cloud" && !shown) toast("A sad cloud just turned into sunshine.", 2400);
  }
  function finish() {
    won = true; running = false; items = [];
    toastEl.classList.remove("show");
    burst(W / 2, H * 0.45, 90, [C.rose, "#ff9eb5", C.sunHex, "#c4a8ff", "#ffffff"]);
    $("finaleMsg").textContent = finaleText(userName);
    $("finale").hidden = false;
    blip(784, 0.4); setTimeout(function () { blip(988, 0.4); }, 160); setTimeout(function () { blip(1319, 0.6); }, 330);
  }

  function update(dt) {
    t += dt;
    dp += (Math.min(1, score / GOAL) - dp) * Math.min(1, dt * 2);
    happy = Math.max(0, happy - dt);
    var dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (dir) cup.tx = clamp(cup.tx + dir * 460 * dt, cup.w / 2, W - cup.w / 2);
    cup.x += (cup.tx - cup.x) * Math.min(1, dt * 14);

    if (running) {
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = 0.95 - Math.min(0.3, score * 0.006); }
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y += it.vy * dt; it.x += Math.sin(t * 1.5 + it.sw) * 12 * dt; it.rot += dt * 1.4;
        if (it.y > cup.y - 24 && it.y < cup.y + 10 && Math.abs(it.x - cup.x) < cup.w / 2 + it.r * 0.4) {
          items.splice(i, 1); caught(it);
        } else if (it.y > groundY - 2) {
          burst(it.x, groundY - 2, 4, ["#ffffff"]); items.splice(i, 1);
        }
      }
    }
    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.life += dt; p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life > p.max) parts.splice(j, 1);
    }
  }

  // ---- drawing ----
  function heart(x, y, s, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
    ctx.beginPath(); ctx.moveTo(0, 12);
    ctx.bezierCurveTo(-22, -2, -10, -18, 0, -6);
    ctx.bezierCurveTo(10, -18, 22, -2, 0, 12);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  }
  function star(x, y, r, rot, fill) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.48 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function puff(x, y, s, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    ctx.arc(x - 14 * s, y + 2 * s, 12 * s, 0, 7);
    ctx.arc(x, y - 6 * s, 16 * s, 0, 7);
    ctx.arc(x + 15 * s, y + 2 * s, 12 * s, 0, 7);
    ctx.rect(x - 14 * s, y + 2 * s, 29 * s, 12 * s);
    ctx.fill();
  }
  function sadCloud(it) {
    var s = it.r / 26;
    puff(it.x, it.y, s, "#7b7f9e");
    ctx.fillStyle = "#2f2b45";
    ctx.beginPath(); ctx.arc(it.x - 7 * s, it.y + 3 * s, 2.2 * s, 0, 7); ctx.arc(it.x + 7 * s, it.y + 3 * s, 2.2 * s, 0, 7); ctx.fill();
    ctx.strokeStyle = "#2f2b45"; ctx.lineWidth = 2 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(it.x - 5 * s, it.y + 11 * s); ctx.quadraticCurveTo(it.x, it.y + 6 * s, it.x + 5 * s, it.y + 11 * s); ctx.stroke();
    ctx.fillStyle = "rgba(120,160,230,.8)";
    var d = (t * 60 + it.sw * 20) % 18;
    ctx.beginPath(); ctx.arc(it.x - 9 * s, it.y + 18 * s + d, 2 * s, 0, 7); ctx.arc(it.x + 9 * s, it.y + 24 * s + (d + 8) % 18, 2 * s, 0, 7); ctx.fill();
  }
  function drawCup() {
    var x = cup.x, y = cup.y, w = cup.w;
    ctx.fillStyle = "rgba(58,47,79,.18)";
    ctx.beginPath(); ctx.ellipse(x, y + 20, w * 0.62, 7, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = C.paper; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(x + w / 2 - 2, y - 2, 13, -1.2, 1.5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - 20); ctx.lineTo(x + w / 2, y - 20);
    ctx.lineTo(x + w / 2 - 12, y + 12); ctx.quadraticCurveTo(x, y + 20, x - w / 2 + 12, y + 12);
    ctx.closePath(); ctx.fillStyle = C.paper; ctx.fill();
    ctx.fillStyle = C.rose; ctx.fillRect(x - w / 2 + 2, y - 20, w - 4, 7);
    ctx.fillStyle = C.ink;
    var blink = (t % 4) < 0.12;
    ctx.beginPath();
    if (blink) { ctx.rect(x - 15, y - 3, 8, 2); ctx.rect(x + 7, y - 3, 8, 2); }
    else { ctx.arc(x - 11, y - 2, 2.8, 0, 7); ctx.arc(x + 11, y - 2, 2.8, 0, 7); }
    ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2;
    ctx.beginPath();
    var m = happy > 0 ? 9 : 5;
    ctx.moveTo(x - 7, y + 4); ctx.quadraticCurveTo(x, y + 4 + m, x + 7, y + 4); ctx.stroke();
    ctx.fillStyle = "rgba(239,93,122,.35)";
    ctx.beginPath(); ctx.arc(x - 19, y + 5, 4, 0, 7); ctx.arc(x + 19, y + 5, 4, 0, 7); ctx.fill();
  }
  function drawFlower(f) {
    var g = clamp((t - f.born) * 1.6, 0, 1), e = 1 - Math.pow(1 - g, 3);
    var u = f.x / W, by = groundY - 48 * u * (1 - u) + 6, top = by - f.h * e;
    ctx.strokeStyle = "#4e9a65"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.x, by); ctx.quadraticCurveTo(f.x + 4, (by + top) / 2, f.x, top); ctx.stroke();
    var pr = 4.5 * e;
    ctx.fillStyle = f.c;
    for (var i = 0; i < 5; i++) {
      var a = i * Math.PI * 2 / 5;
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * pr * 1.2, top + Math.sin(a) * pr * 1.2, pr, 0, 7); ctx.fill();
    }
    ctx.fillStyle = C.sunHex; ctx.beginPath(); ctx.arc(f.x, top, pr * 0.8, 0, 7); ctx.fill();
  }
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix(C.topSad, C.topGlad, dp));
    g.addColorStop(1, mix(C.botSad, C.botGlad, dp));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // sun
    var sx = W - 62, sy = 112, sr = 24 + 16 * dp, sa = 0.25 + 0.75 * dp;
    var glow = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 3.2);
    glow.addColorStop(0, "rgba(" + C.sun.join(",") + "," + (0.5 * sa) + ")");
    glow.addColorStop(1, "rgba(" + C.sun.join(",") + ",0)");
    ctx.fillStyle = glow; ctx.fillRect(sx - sr * 3.2, sy - sr * 3.2, sr * 6.4, sr * 6.4);
    ctx.strokeStyle = "rgba(" + C.sun.join(",") + "," + sa + ")"; ctx.lineWidth = 3; ctx.lineCap = "round";
    var spin = reduce ? 0 : t * 0.25;
    for (var k = 0; k < 12; k++) {
      var a = spin + k * Math.PI / 6;
      ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * (sr + 6), sy + Math.sin(a) * (sr + 6));
      ctx.lineTo(sx + Math.cos(a) * (sr + 14 + 6 * dp), sy + Math.sin(a) * (sr + 14 + 6 * dp)); ctx.stroke();
    }
    ctx.fillStyle = "rgba(" + C.sun.join(",") + "," + sa + ")";
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();

    // drifting background clouds
    for (var i = 0; i < 3; i++) {
      var cx = ((reduce ? 0 : t) * (6 + i * 4) + i * (W / 3)) % (W + 200) - 100;
      puff(cx, 170 + i * 78, 1.5 - i * 0.15, "rgba(255,255,255," + (0.5 - 0.3 * dp) + ")");
    }

    // ground
    ctx.fillStyle = mix(C.gSad, C.gGlad, dp);
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, groundY);
    ctx.quadraticCurveTo(W / 2, groundY - 24, W, groundY); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    for (var f = 0; f < flowers.length; f++) drawFlower(flowers[f]);

    // falling things
    for (var n = 0; n < items.length; n++) {
      var it = items[n];
      if (it.type === "heart") heart(it.x, it.y, it.r, C.rose);
      else if (it.type === "star") star(it.x, it.y, it.r, it.rot, C.sunHex);
      else sadCloud(it);
    }
    drawCup();
    for (var q = 0; q < parts.length; q++) {
      var p = parts[q];
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- input ----
  function moveTo(e) {
    var r = cv.getBoundingClientRect();
    cup.tx = clamp(e.clientX - r.left, cup.w / 2, W - cup.w / 2);
  }
  cv.addEventListener("pointerdown", moveTo);
  cv.addEventListener("pointermove", moveTo);
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.l = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.r = true;
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.l = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.r = false;
  });

  // ---- start / finale ----
  function begin() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !ac) ac = new AC();
      if (ac && ac.resume) ac.resume();
    } catch (e) {}
    items = []; parts = []; flowers = []; won = false; lastLevel = 0; setScore(0);
    spawnT = 0.4; running = true;
    $("start").hidden = true;
    toast("Hi " + userName + ". Catch the hearts.", 2600);
  }
  $("play").addEventListener("click", begin);
  $("again").addEventListener("click", function () {
    $("finale").hidden = true; begin();
  });
  $("menu").addEventListener("click", function () {
    $("finale").hidden = true;
    items = []; parts = []; flowers = []; won = false; lastLevel = 0; setScore(0);
    $("start").hidden = false;
  });
})();
</script>

</body></html>
